{% extends "base.html" %}

{% block title %}Login - Online Judge{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h3 class="text-center mb-0">🎯 Welcome Back</h3>
        <p class="text-center mb-0 mt-1">Ready to solve some problems?</p>
      </div>
      <div class="card-body">
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
        
        <form method="post">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="id_username" class="form-label">👤 Username</label>
            <input type="text" name="username" class="form-control form-control-lg" id="id_username" 
                   placeholder="Enter your username" required autofocus>
          </div>
          
          <div class="mb-4">
            <label for="id_password" class="form-label">🔐 Password</label>
            <input type="password" name="password" class="form-control form-control-lg" id="id_password" 
                   placeholder="Enter your password" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-100 btn-lg">🚀 Let's Code!</button>
        </form>
        
        <div class="text-center mt-4">
          <p class="mb-0">New here? <a href="{% url 'register' %}" class="text-decoration-none">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
